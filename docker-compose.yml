services:
  db:
    image: mysql:8.0
    container_name: mysql-clinic
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: clinic
      MYSQL_USER: user
      MYSQL_PASSWORD: 123456
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
  networks:
  app-network:
    driver: bridge
